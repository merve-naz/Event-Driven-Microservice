<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <title>Query Client</title>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
          integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk"
          crossorigin="anonymous">

    <title>Twitter Search Engine</title>
</head>

<body id="query-client">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark"
     th:fragment="menu">

    <div class="collapse navbar-collapse"
         id="navbarSupportedContent">

        <ul class="navbar-nav mr-auto">

            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/}">
                    Main page
                </a>
            </li>

            <li class="nav-item"
                th:if="${#authorization.expression('isAuthenticated()')}">

                <a class="nav-link"
                   th:href="@{/home}">
                    Search page
                </a>

            </li>

        </ul>

        <div class="row">

            <div class="col-12"
                 th:if="${#authorization.expression('isAuthenticated()')}">

                <p class="text-light bg-dark float-right">
                    Welcome,
                    <span th:text="${#authentication.principal.username}"></span>!
                </p>

            </div>

            <form class="col-12"
                  method="post"
                  th:action="@{/logout}"
                  th:if="${#authorization.expression('isAuthenticated()')}">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <button id="logout-button"
                        type="submit"
                        class="btn btn-danger float-right">
                    Logout
                </button>

            </form>

            <form class="col-12"
                  method="get"
                  th:action="@{/home}"
                  th:unless="${#authorization.expression('isAuthenticated()')}">

                <button id="login-button"
                        class="btn btn-primary float-right"
                        type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

</nav>

</body>
</html>

<!--th: ile başlayan bütün attribute'lar Thymeleaf'e aittir.-->
<!--| Thymeleaf     | Kısa Tanımı                                      | HTML'de Karşılığı   |-->
<!--| `th:href`     | Link oluşturur.                                  | `href=""`           |-->
<!--| `th:text`     | Bir etiketin içine metin yazar.                  | `<span>Yazı</span>` |-->
<!--| `th:if`       | Şart doğruysa gösterir. (`if`)                   | HTML karşılığı yok  |-->
<!--| `th:unless`   | Şart yanlışsa gösterir. (`if !`)                 | HTML karşılığı yok  |-->
<!--| `th:each`     | Döngü oluşturur. (`for`)                         | HTML karşılığı yok  |-->
<!--| `th:value`    | Input'un değerini doldurur.                      | `value=""`          |-->
<!--| `th:action`   | Formun gönderileceği URL'yi belirler.            | `action=""`         |-->
<!--| `th:fragment` | Tekrar kullanılacak HTML parçasını tanımlar.     | HTML karşılığı yok  |-->
<!--| `th:replace`  | Başka bir fragment ile tamamen değiştirir.       | HTML karşılığı yok  |-->
<!--| `th:insert`   | Bmmmaşka bir fragment'i içine ekler.                | HTML karşılığı yok  |-->
<!--| `th:object`   | Formun bağlı olduğu Java nesnesini belirtir.     | HTML karşılığı yok  |-->
<!--| `th:field`    | Form alanını Java nesnesindeki bir alana bağlar. | `name` + `value`    |-->
<!--Bunu tarayıcı değil, Spring Boot (Thymeleaf) çalıştıracak.-->

<!--| Thymeleaf                              | Angular                              |-->
<!--| Server Side Rendering (SSR)            | Client Side Rendering (CSR)          |-->
<!--| Java + Spring Boot ile çalışır         | TypeScript + Angular ile çalışır     |-->
<!--| HTML sunucuda oluşturulur              | HTML tarayıcıda oluşturulur          |-->
<!--| Sayfa yenilenir                        | Sayfa yenilenmeden değişebilir (SPA) |-->
<!--| `th:text`, `th:if`, `th:each` kullanır | `{{ }}`, `*ngIf`, `*ngFor` kullanır  |-->

<!--CSRF = Cross-Site Request Forgery => -->
<!--Bu isteği gerçekten sen mi gönderdin, yoksa başka bir site senin adına mı gönderdi?-->

<!--| JWT                      | CSRF Token                              |-->
<!--| Kullanıcı kim?           | İstek güvenli mi?                       |-->
<!--| Authentication           | Güvenlik doğrulaması                    |-->
<!--| Header'da taşınır        | Form içinde gönderilir                  |-->
<!--| Login sonrası kullanılır | POST/PUT/DELETE isteklerinde kullanılır |-->
<!--| Uzun süre yaşayabilir    | Genellikle oturum boyunca geçerlidir    |-->
<!--JWT = Kimlik kartı. (Kullanıcının kim olduğunu ispatlar.)-->
<!--CSRF Token = Güvenlik bileti. (İsteğin gerçekten senin uygulamandan geldiğini ispatlar.)-->

<!--Session + Form Login kullanıldığında CSRF koruması varsayılan olarak açıktır.-->
<!--Ancak stateless JWT API geliştirirken genellikle CSRF koruması kapatılır (csrf().disable()),-->
<!--çünkü JWT'nin kullanıldığı API'lerde tarayıcı oturum çerezlerine dayalı bu saldırı senaryosu genellikle geçerli değildir.-->
