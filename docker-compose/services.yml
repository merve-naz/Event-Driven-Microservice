version: '3.7'

services:

  twitter-to-kafka-service:
    image: com.microservices.demo/ai-generated-tweet-kafka-service:0.0.1-SNAPSHOT

    ports:
      - "5005:5005"

    volumes:
      - "./docker-logs:/workspace/twitter-to-kafka-service/logs"
      - "./check-config-server-started.sh:/workspace/check-config-server-started.sh"

    user: root

    entrypoint: ["sh", "/workspace/check-config-server-started.sh"]

    environment:
      - "JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Xms128m -Xmx256m"
      - "LOGGING_LEVEL_COM_MICROSERVICES_DEMO=info"
      - "LOGGING_LEVEL_ROOT=info"
      - "KAFKA_CONFIG_TOPIC_NAME=twitter-topic"
      - "KAFKA_CONFIG_BOOTSTRAP_SERVERS=kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092"
      - "KAFKA_CONFIG_SCHEMA_REGISTRY_URL=http://schema-registry:8081"
      - "SPRING_CONFIG_IMPORT=configserver:http://config-server:8888"
      - "ENCRYPT_KEY=${ENCRYPT_KEY}"

    depends_on:
      - config-server

    networks:
      - ${GLOBAL_NETWORK:-kafka-net}

  config-server:
    image: com.microservices.demo/config.server:0.0.1-SNAPSHOT

    ports:
      - "8888:8888"

    volumes:
      - "./docker-logs:/workspace/config-server/logs"

    environment:
      - "ENCRYPT_KEY=${ENCRYPT_KEY}"

    networks:
      - ${GLOBAL_NETWORK:-kafka-net}